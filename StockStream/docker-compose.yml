services:
  db:
    image: postgres:15
    container_name: stockstream-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: stockstream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: stockstream
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://postgres:8954@db:5432/stockstream?schema=public"
    volumes:
      - .:/app
    command: npm run dev

volumes:
  pgdata:
